<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-label="First internship CV blueprint with formatting sections, impact bullets and skills">
  <defs>
    <linearGradient id="artCareerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30204F" />
      <stop offset="100%" stop-color="#553A85" />
    </linearGradient>
    <filter id="cvShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#artCareerGrad)" />

  <g transform="translate(140, 60)" filter="url(#cvShadow)">
    <rect x="0" y="0" width="520" height="380" rx="12" fill="#FFFFFF" stroke="#E8E2F2" stroke-width="2" />
    
    <!-- Top CV Accent Bar -->
    <rect x="0" y="0" width="520" height="8" rx="4" fill="#7256B5" />
    
    <!-- CV Header -->
    <text x="40" y="45" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#30204F">First Internship CV Architecture</text>
    <text x="40" y="68" font-family="Arial, sans-serif" font-size="11" fill="#7256B5" font-weight="bold">STAND OUT WITHOUT PREVIOUS FULL-TIME EXPERIENCE</text>

    <line x1="40" y1="85" x2="480" y2="85" stroke="#E8E2F2" stroke-width="1.5" />

    <!-- Section 1: Education & Coursework -->
    <text x="40" y="112" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#30204F">1. EDUCATION &amp; HONOURS (Top 1/3 Placement)</text>
    <rect x="40" y="122" width="440" height="42" rx="6" fill="#F4F0FF" />
    <text x="55" y="140" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#30204F">B.S. in Software Engineering • Top 5% Rank</text>
    <text x="55" y="154" font-family="Arial, sans-serif" font-size="9" fill="#4B4657">Relevant Modules: Algorithms, Data Systems, Software Engineering Practice, Statistics</text>

    <!-- Section 2: Projects with STAR format -->
    <text x="40" y="188" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#30204F">2. ACADEMIC &amp; CAPSTONE PROJECTS (STAR Formula)</text>
    <rect x="40" y="198" width="440" height="75" rx="6" fill="#FAF9FD" stroke="#E8E2F2" />
    <text x="55" y="216" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7256B5">Campus Ride-Sharing Web Portal (Lead Developer)</text>
    <text x="55" y="232" font-family="Arial, sans-serif" font-size="9" fill="#4B4657">• Action: Built real-time routing portal using modern web standards and relational database.</text>
    <text x="55" y="248" font-family="Arial, sans-serif" font-size="9" fill="#4B4657">• Impact: Adopted by 850+ campus students during orientation week with zero server crashes.</text>
    <text x="55" y="263" font-family="Arial, sans-serif" font-size="9" fill="#7256B5">Key take: Quantify outcomes with numbers, percentages, and tangible results.</text>

    <!-- Section 3: Technical & Soft Skills Categorization -->
    <text x="40" y="300" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#30204F">3. SKILLS CATEGORIZATION (ATS-Optimized)</text>
    <rect x="40" y="310" width="140" height="30" rx="4" fill="#F4F0FF" />
    <text x="50" y="328" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#7256B5">Languages: Python, JS, C++</text>

    <rect x="190" y="310" width="140" height="30" rx="4" fill="#F4F0FF" />
    <text x="200" y="328" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#7256B5">Tools: Git, Linux, Figma</text>

    <rect x="340" y="310" width="140" height="30" rx="4" fill="#30204F" />
    <text x="350" y="328" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">Soft: Team Leadership</text>

    <text x="40" y="362" font-family="Arial, sans-serif" font-size="10" fill="#7256B5">✦ Clean 1-Page Layout · Zero Filler · Verifiable GitHub Links</text>
  </g>
</svg>

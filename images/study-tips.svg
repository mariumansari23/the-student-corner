<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-label="Active recall and modern note-taking setup with study cards and highlighters">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9FD" />
      <stop offset="100%" stop-color="#F4F0FF" />
    </linearGradient>
    <filter id="fShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#30204F" flood-opacity="0.07" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#cardBg)" stroke="#E8E2F2" stroke-width="2" />
  
  <!-- Subtle Geometry & Floating Glyphs -->
  <circle cx="680" cy="120" r="100" fill="#F4F0FF" />
  <circle cx="120" cy="380" r="90" fill="#E8E2F2" opacity="0.4" />

  <!-- Open Study Notebook Left Page & Right Page -->
  <g transform="translate(160, 90)" filter="url(#fShadow)">
    <!-- Book Spine & Pages -->
    <rect x="0" y="0" width="480" height="310" rx="12" fill="#FFFFFF" stroke="#E8E2F2" stroke-width="2" />
    <line x1="240" y1="0" x2="240" y2="310" stroke="#E8E2F2" stroke-width="3" />

    <!-- Left Page: The Cornell Note System -->
    <text x="30" y="42" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#30204F">The Cornell Method</text>
    <line x1="30" y1="55" x2="210" y2="55" stroke="#7256B5" stroke-width="1.5" />
    
    <!-- Cue Column -->
    <line x1="90" y1="65" x2="90" y2="240" stroke="#E8E2F2" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="35" y="85" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7256B5">KEY CUES</text>
    <text x="35" y="110" font-family="Arial, sans-serif" font-size="10" fill="#4B4657">Active Recall</text>
    <text x="35" y="135" font-family="Arial, sans-serif" font-size="10" fill="#4B4657">Retention %</text>
    <text x="35" y="160" font-family="Arial, sans-serif" font-size="10" fill="#4B4657">Intervals</text>
    
    <!-- Notes Column -->
    <text x="100" y="85" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#30204F">CLASS NOTES &amp; CONCEPTS</text>
    <rect x="100" y="100" width="115" height="12" rx="3" fill="#F4F0FF" />
    <line x1="100" y1="125" x2="215" y2="125" stroke="#E8E2F2" stroke-width="2" />
    <line x1="100" y1="145" x2="200" y2="145" stroke="#E8E2F2" stroke-width="2" />
    <line x1="100" y1="165" x2="210" y2="165" stroke="#E8E2F2" stroke-width="2" />
    <line x1="100" y1="185" x2="190" y2="185" stroke="#E8E2F2" stroke-width="2" />
    
    <!-- Summary Footer Row -->
    <line x1="30" y1="245" x2="215" y2="245" stroke="#7256B5" stroke-width="1.5" />
    <text x="35" y="265" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7256B5">SUMMARY:</text>
    <text x="35" y="285" font-family="Arial, sans-serif" font-size="9" fill="#4B4657">Testing memory boosts neural retention by 300%</text>

    <!-- Right Page: Feynman Technique & Diagram -->
    <text x="270" y="42" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#30204F">Feynman Technique</text>
    <line x1="270" y1="55" x2="450" y2="55" stroke="#7256B5" stroke-width="1.5" />
    
    <!-- 4 Step Diagram -->
    <rect x="270" y="75" width="80" height="42" rx="6" fill="#F4F0FF" stroke="#E8E2F2" />
    <text x="310" y="93" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#7256B5" text-anchor="middle">1. Study</text>
    <text x="310" y="107" font-family="Arial, sans-serif" font-size="8" fill="#4B4657" text-anchor="middle">Pick concept</text>
    
    <path d="M 353 96 L 368 96" stroke="#7256B5" stroke-width="2" stroke-linecap="round" />
    
    <rect x="370" y="75" width="80" height="42" rx="6" fill="#7256B5" />
    <text x="410" y="93" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. Teach</text>
    <text x="410" y="107" font-family="Arial, sans-serif" font-size="8" fill="#F4F0FF" text-anchor="middle">Plain language</text>

    <rect x="270" y="140" width="80" height="42" rx="6" fill="#F4F0FF" stroke="#E8E2F2" />
    <text x="310" y="158" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#7256B5" text-anchor="middle">3. Identify</text>
    <text x="310" y="172" font-family="Arial, sans-serif" font-size="8" fill="#4B4657" text-anchor="middle">Knowledge gaps</text>

    <path d="M 353 161 L 368 161" stroke="#7256B5" stroke-width="2" stroke-linecap="round" />

    <rect x="370" y="140" width="80" height="42" rx="6" fill="#30204F" />
    <text x="410" y="158" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4. Simplify</text>
    <text x="410" y="172" font-family="Arial, sans-serif" font-size="8" fill="#E8E2F2" text-anchor="middle">Analogies &amp; flow</text>

    <!-- Visual Knowledge Anchor -->
    <rect x="270" y="205" width="180" height="75" rx="6" fill="#FAF9FD" stroke="#E8E2F2" />
    <text x="282" y="228" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#30204F">Cognitive Retention Anchor</text>
    <path d="M 285 260 C 310 260, 320 235, 350 240 C 380 245, 400 220, 435 225" fill="none" stroke="#7256B5" stroke-width="2.5" />
  </g>

  <!-- Sticky Study Flashcards -->
  <g transform="translate(620, 260) rotate(8)" filter="url(#fShadow)">
    <rect x="0" y="0" width="120" height="130" rx="6" fill="#FFFFFF" stroke="#7256B5" stroke-width="1.5" />
    <rect x="0" y="0" width="120" height="24" rx="4" fill="#7256B5" />
    <text x="60" y="16" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">FLASHCARD #04</text>
    <text x="12" y="48" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#30204F">Q: Leitner Box?</text>
    <text x="12" y="70" font-family="Arial, sans-serif" font-size="9" fill="#4B4657">Spaced review based on correctness.</text>
    <circle cx="60" cy="105" r="14" fill="#F4F0FF" />
    <text x="60" y="110" font-family="Arial, sans-serif" font-size="14" fill="#7256B5" text-anchor="middle">✓</text>
  </g>

  <!-- Highlighter Marker Tool -->
  <g transform="translate(80, 210) rotate(-40)" filter="url(#fShadow)">
    <rect x="0" y="0" width="120" height="26" rx="6" fill="#7256B5" />
    <polygon points="120,4 140,13 120,22" fill="#30204F" />
    <polygon points="140,9 152,13 140,17" fill="#A288E3" />
    <rect x="15" y="7" width="60" height="12" rx="3" fill="#FFFFFF" opacity="0.3" />
  </g>
</svg>

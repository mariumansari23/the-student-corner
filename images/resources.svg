<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-label="Student toolkit, open educational resources, templates and guides">
  <defs>
    <linearGradient id="resBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F0FF" />
      <stop offset="100%" stop-color="#FAF9FD" />
    </linearGradient>
    <filter id="rShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#30204F" flood-opacity="0.08" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#resBg)" stroke="#E8E2F2" stroke-width="2" />

  <!-- Library Bookshelf & Digital Toolkit Layout -->
  <g transform="translate(120, 80)" filter="url(#rShadow)">
    <rect x="0" y="0" width="560" height="340" rx="12" fill="#FFFFFF" stroke="#E8E2F2" stroke-width="2" />
    <!-- Shelf Top Bar -->
    <rect x="0" y="0" width="560" height="46" rx="12" fill="#30204F" />
    <rect x="0" y="34" width="560" height="12" fill="#30204F" />
    <text x="25" y="29" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#FFFFFF">The Student Corner • Curated Academic Toolkit</text>
    
    <!-- Row 1: Resource Cards -->
    <g transform="translate(25, 65)">
      <rect x="0" y="0" width="155" height="110" rx="8" fill="#F4F0FF" stroke="#E8E2F2" />
      <text x="15" y="25" font-family="Arial, sans-serif" font-size="18">📝</text>
      <text x="15" y="50" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#30204F">Study Planners</text>
      <text x="15" y="70" font-family="Arial, sans-serif" font-size="10" fill="#4B4657">Printable weekly &amp; daily schedule sheets.</text>
      <text x="15" y="95" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7256B5">Free Templates →</text>
    </g>

    <g transform="translate(200, 65)">
      <rect x="0" y="0" width="155" height="110" rx="8" fill="#FAF9FD" stroke="#E8E2F2" />
      <text x="15" y="25" font-family="Arial, sans-serif" font-size="18">⚡</text>
      <text x="15" y="50" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#30204F">Note Systems</text>
      <text x="15" y="70" font-family="Arial, sans-serif" font-size="10" fill="#4B4657">Cornell, Outline, Boxing &amp; Mind Maps.</text>
      <text x="15" y="95" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7256B5">Explore Formats →</text>
    </g>

    <g transform="translate(380, 65)">
      <rect x="0" y="0" width="155" height="110" rx="8" fill="#F4F0FF" stroke="#E8E2F2" />
      <text x="15" y="25" font-family="Arial, sans-serif" font-size="18">🌐</text>
      <text x="15" y="50" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#30204F">Open Education</text>
      <text x="15" y="70" font-family="Arial, sans-serif" font-size="10" fill="#4B4657">MIT OCW, Khan Academy &amp; OpenStax.</text>
      <text x="15" y="95" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7256B5">Open Repositories →</text>
    </g>

    <!-- Row 2: Tech & Career Cards -->
    <g transform="translate(25, 195)">
      <rect x="0" y="0" width="155" height="110" rx="8" fill="#FAF9FD" stroke="#E8E2F2" />
      <text x="15" y="25" font-family="Arial, sans-serif" font-size="18">💻</text>
      <text x="15" y="50" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#30204F">Coding &amp; STEM</text>
      <text x="15" y="70" font-family="Arial, sans-serif" font-size="10" fill="#4B4657">MDN, freeCodeCamp, CS50 &amp; DevDocs.</text>
      <text x="15" y="95" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7256B5">Tech Guides →</text>
    </g>

    <g transform="translate(200, 195)">
      <rect x="0" y="0" width="155" height="110" rx="8" fill="#F4F0FF" stroke="#E8E2F2" />
      <text x="15" y="25" font-family="Arial, sans-serif" font-size="18">💼</text>
      <text x="15" y="50" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#30204F">CV &amp; Interview</text>
      <text x="15" y="70" font-family="Arial, sans-serif" font-size="10" fill="#4B4657">ATS-friendly student resume templates.</text>
      <text x="15" y="95" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7256B5">Career Kit →</text>
    </g>

    <g transform="translate(380, 195)">
      <rect x="0" y="0" width="155" height="110" rx="8" fill="#FAF9FD" stroke="#E8E2F2" />
      <text x="15" y="25" font-family="Arial, sans-serif" font-size="18">🎯</text>
      <text x="15" y="50" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#30204F">Habit Builders</text>
      <text x="15" y="70" font-family="Arial, sans-serif" font-size="10" fill="#4B4657">Spaced study trackers and daily logs.</text>
      <text x="15" y="95" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7256B5">Download Logs →</text>
    </g>
  </g>
</svg>

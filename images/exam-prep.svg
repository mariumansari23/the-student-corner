<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-label="Exam preparation timetable, study hourglass, and revision checklist">
  <defs>
    <linearGradient id="examBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9FD" />
      <stop offset="100%" stop-color="#F4F0FF" />
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#30204F" flood-opacity="0.08" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#examBg)" stroke="#E8E2F2" stroke-width="2" />

  <!-- Exam Checklist Board -->
  <g transform="translate(130, 80)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="340" rx="10" fill="#FFFFFF" stroke="#E8E2F2" stroke-width="2" />
    <!-- Header banner -->
    <rect x="0" y="0" width="340" height="50" rx="10" fill="#30204F" />
    <rect x="0" y="38" width="340" height="12" fill="#30204F" />
    <text x="24" y="32" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#FFFFFF">Exam Readiness Checklist</text>
    
    <!-- Checklist items with checkmarks -->
    <g transform="translate(24, 75)">
      <circle cx="12" cy="12" r="10" fill="#7256B5" />
      <path d="M 8 12 L 11 15 L 17 8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <text x="32" y="16" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#30204F">Past Exam Papers (Last 5 Years)</text>
    </g>

    <g transform="translate(24, 120)">
      <circle cx="12" cy="12" r="10" fill="#7256B5" />
      <path d="M 8 12 L 11 15 L 17 8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <text x="32" y="16" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#30204F">Formula Sheet &amp; Definitions</text>
    </g>

    <g transform="translate(24, 165)">
      <circle cx="12" cy="12" r="10" fill="#7256B5" />
      <path d="M 8 12 L 11 15 L 17 8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <text x="32" y="16" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#30204F">Spaced Repetition Flashcards</text>
    </g>

    <g transform="translate(24, 210)">
      <circle cx="12" cy="12" r="10" fill="#7256B5" />
      <path d="M 8 12 L 11 15 L 17 8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <text x="32" y="16" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#30204F">Timed Mock Exam Session</text>
    </g>

    <g transform="translate(24, 255)">
      <circle cx="12" cy="12" r="10" fill="#F4F0FF" stroke="#7256B5" stroke-width="2" />
      <text x="32" y="16" font-family="Arial, sans-serif" font-size="12" fill="#4B4657">Stationery &amp; Student ID Packed</text>
    </g>

    <line x1="24" y1="295" x2="316" y2="295" stroke="#E8E2F2" stroke-width="1.5" />
    <text x="24" y="318" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7256B5">Status: 85% Prepared · Confidence High</text>
  </g>

  <!-- Exam Countdown & Hourglass Visual -->
  <g transform="translate(510, 100)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="200" height="300" rx="10" fill="#FFFFFF" stroke="#E8E2F2" stroke-width="2" />
    <rect x="20" y="20" width="160" height="40" rx="6" fill="#F4F0FF" />
    <text x="100" y="44" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#7256B5" text-anchor="middle">Revision Countdown</text>
    
    <!-- Hourglass Outline & Sand -->
    <g transform="translate(60, 80)">
      <rect x="0" y="0" width="80" height="8" rx="2" fill="#30204F" />
      <rect x="0" y="132" width="80" height="8" rx="2" fill="#30204F" />
      <!-- Glass Bulbs -->
      <path d="M 10 8 C 10 50, 36 65, 40 70 C 36 75, 10 90, 10 132 L 70 132 C 70 90, 44 75, 40 70 C 44 65, 70 50, 70 8 Z" fill="#F4F0FF" stroke="#7256B5" stroke-width="2" />
      <!-- Top Sand -->
      <path d="M 22 45 C 30 55, 50 55, 58 45 L 22 45 Z" fill="#7256B5" />
      <!-- Trickle -->
      <line x1="40" y1="55" x2="40" y2="105" stroke="#7256B5" stroke-width="2" stroke-dasharray="3,2" />
      <!-- Bottom Sand Heap -->
      <path d="M 20 130 C 25 105, 55 105, 60 130 Z" fill="#7256B5" />
    </g>

    <!-- Score Badge -->
    <rect x="20" y="240" width="160" height="38" rx="6" fill="#30204F" />
    <text x="100" y="264" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Target Grade: First Class / A+</text>
  </g>
</svg>

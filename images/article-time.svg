<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-label="How to create a weekly study schedule visual timetable diagram">
  <defs>
    <linearGradient id="timeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9FD" />
      <stop offset="100%" stop-color="#F4F0FF" />
    </linearGradient>
    <filter id="tShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#30204F" flood-opacity="0.08" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#timeBg)" stroke="#E8E2F2" stroke-width="2" />

  <!-- Weekly Timetable Preview Grid -->
  <g transform="translate(110, 80)" filter="url(#tShadow)">
    <rect x="0" y="0" width="580" height="340" rx="12" fill="#FFFFFF" stroke="#E8E2F2" stroke-width="2" />
    <!-- Table Header Row -->
    <rect x="0" y="0" width="580" height="48" rx="12" fill="#30204F" />
    <rect x="0" y="36" width="580" height="12" fill="#30204F" />
    <text x="25" y="30" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#FFFFFF">Sample Weekly Schedule: Balanced Time Blocking</text>
    
    <!-- Days Columns -->
    <g transform="translate(20, 60)">
      <!-- Day Headers -->
      <text x="80" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7256B5">MON</text>
      <text x="160" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7256B5">TUE</text>
      <text x="240" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7256B5">WED</text>
      <text x="320" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7256B5">THU</text>
      <text x="400" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7256B5">FRI</text>
      <text x="480" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#30204F">WEEKEND</text>

      <line x1="0" y1="30" x2="540" y2="30" stroke="#E8E2F2" stroke-width="1.5" />

      <!-- Morning Block -->
      <text x="5" y="60" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#4B4657">08:00 - 12:00</text>
      <rect x="70" y="44" width="65" height="28" rx="4" fill="#F4F0FF" />
      <text x="102" y="62" font-family="Arial, sans-serif" font-size="9" fill="#7256B5" text-anchor="middle">Lectures</text>
      
      <rect x="150" y="44" width="65" height="28" rx="4" fill="#7256B5" />
      <text x="182" y="62" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Deep Study</text>

      <rect x="230" y="44" width="65" height="28" rx="4" fill="#F4F0FF" />
      <text x="262" y="62" font-family="Arial, sans-serif" font-size="9" fill="#7256B5" text-anchor="middle">Lectures</text>

      <rect x="310" y="44" width="65" height="28" rx="4" fill="#7256B5" />
      <text x="342" y="62" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Deep Study</text>

      <rect x="390" y="44" width="65" height="28" rx="4" fill="#F4F0FF" />
      <text x="422" y="62" font-family="Arial, sans-serif" font-size="9" fill="#7256B5" text-anchor="middle">Lab Session</text>

      <rect x="470" y="44" width="65" height="28" rx="4" fill="#E8E2F2" />
      <text x="502" y="62" font-family="Arial, sans-serif" font-size="9" fill="#30204F" text-anchor="middle">Rest &amp; Sport</text>

      <!-- Midday / Lunch -->
      <rect x="70" y="85" width="465" height="20" rx="4" fill="#FAF9FD" stroke="#E8E2F2" />
      <text x="300" y="99" font-family="Arial, sans-serif" font-size="9" fill="#4B4657" text-anchor="middle">12:00 - 13:30 • Healthy Lunch, Walk &amp; Mental Reset</text>

      <!-- Afternoon Block -->
      <text x="5" y="135" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#4B4657">13:30 - 17:00</text>
      <rect x="70" y="118" width="65" height="30" rx="4" fill="#FAF9FD" stroke="#E8E2F2" />
      <text x="102" y="136" font-family="Arial, sans-serif" font-size="9" fill="#4B4657" text-anchor="middle">Seminars</text>

      <rect x="150" y="118" width="65" height="30" rx="4" fill="#F4F0FF" />
      <text x="182" y="136" font-family="Arial, sans-serif" font-size="9" fill="#7256B5" text-anchor="middle">Group Work</text>

      <rect x="230" y="118" width="65" height="30" rx="4" fill="#FAF9FD" stroke="#E8E2F2" />
      <text x="262" y="136" font-family="Arial, sans-serif" font-size="9" fill="#4B4657" text-anchor="middle">Library</text>

      <rect x="310" y="118" width="65" height="30" rx="4" fill="#F4F0FF" />
      <text x="342" y="136" font-family="Arial, sans-serif" font-size="9" fill="#7256B5" text-anchor="middle">Office Hours</text>

      <rect x="390" y="118" width="65" height="30" rx="4" fill="#FAF9FD" stroke="#E8E2F2" />
      <text x="422" y="136" font-family="Arial, sans-serif" font-size="9" fill="#4B4657" text-anchor="middle">Weekly Wrap</text>

      <rect x="470" y="118" width="65" height="30" rx="4" fill="#7256B5" />
      <text x="502" y="136" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Weekly Plan</text>

      <!-- Evening Block -->
      <text x="5" y="185" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#4B4657">18:00 - 21:00</text>
      <rect x="70" y="168" width="65" height="28" rx="4" fill="#30204F" />
      <text x="102" y="185" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Spaced Rev.</text>

      <rect x="150" y="168" width="65" height="28" rx="4" fill="#E8E2F2" />
      <text x="182" y="185" font-family="Arial, sans-serif" font-size="9" fill="#30204F" text-anchor="middle">Club / Social</text>

      <rect x="230" y="168" width="65" height="28" rx="4" fill="#30204F" />
      <text x="262" y="185" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Assignment</text>

      <rect x="310" y="168" width="65" height="28" rx="4" fill="#E8E2F2" />
      <text x="342" y="185" font-family="Arial, sans-serif" font-size="9" fill="#30204F" text-anchor="middle">Gym / Fitness</text>

      <rect x="390" y="168" width="65" height="28" rx="4" fill="#E8E2F2" />
      <text x="422" y="185" font-family="Arial, sans-serif" font-size="9" fill="#30204F" text-anchor="middle">Social Night</text>

      <rect x="470" y="168" width="65" height="28" rx="4" fill="#F4F0FF" />
      <text x="502" y="185" font-family="Arial, sans-serif" font-size="9" fill="#7256B5" text-anchor="middle">Unwind</text>
    </g>

    <!-- Footer Note -->
    <text x="35" y="315" font-family="Arial, sans-serif" font-size="11" fill="#7256B5">✦ Rule of Thumb: Block fixed lectures first, allocate 2h daily deep study, protect sleep.</text>
  </g>
</svg>
